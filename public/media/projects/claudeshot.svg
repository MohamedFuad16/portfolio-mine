<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">ClaudeShot workflow preview</title>
  <desc id="desc">A macOS window showing the ClaudeShot hotkey, capture, clipboard, and Claude workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141b"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222733"/>
      <stop offset="1" stop-color="#14171e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>
  <circle cx="1230" cy="80" r="360" fill="#617cff" opacity=".07"/>
  <circle cx="110" cy="760" r="300" fill="#9d65ff" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="116" y="104" width="1208" height="602" rx="34" fill="#0d0f14" stroke="#343946" stroke-width="2"/>
    <path d="M116 174h1208" stroke="#343946" stroke-width="2"/>
    <circle cx="166" cy="139" r="10" fill="#ff5f57"/>
    <circle cx="199" cy="139" r="10" fill="#febc2e"/>
    <circle cx="232" cy="139" r="10" fill="#28c840"/>
    <text x="720" y="147" text-anchor="middle" fill="#8b92a2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">ClaudeShot</text>
  </g>

  <g transform="translate(180 244)">
    <image href="claudeshot-icon.png" x="0" y="0" width="214" height="214"/>
    <text x="107" y="252" text-anchor="middle" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700">One hotkey.</text>
    <text x="107" y="288" text-anchor="middle" fill="#8f96a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">Window to Claude.</text>
  </g>

  <g transform="translate(502 240)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="718" height="326" rx="30" fill="url(#card)" stroke="#3a4050" stroke-width="2"/>
    <text x="42" y="56" fill="#aab1bf" font-size="21" font-weight="600">GLOBAL SHORTCUT</text>
    <g transform="translate(42 82)">
      <rect width="194" height="68" rx="14" fill="#090b0f" stroke="#4a5161" stroke-width="2"/>
      <text x="97" y="44" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">⇧  ⌘  1</text>
    </g>

    <g transform="translate(42 205)">
      <rect width="148" height="70" rx="18" fill="#171b24" stroke="#50586a"/>
      <text x="74" y="31" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Capture</text>
      <text x="74" y="53" text-anchor="middle" fill="#8790a2" font-size="14">front window</text>
      <text x="171" y="43" fill="#697184" font-size="28">→</text>
      <rect x="207" width="148" height="70" rx="18" fill="#171b24" stroke="#50586a"/>
      <text x="281" y="31" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Copy PNG</text>
      <text x="281" y="53" text-anchor="middle" fill="#8790a2" font-size="14">pasteboard</text>
      <text x="378" y="43" fill="#697184" font-size="28">→</text>
      <rect x="414" width="214" height="70" rx="18" fill="#e6d5c4"/>
      <text x="521" y="31" text-anchor="middle" fill="#27211e" font-size="20" font-weight="700">Paste in Claude</text>
      <text x="521" y="53" text-anchor="middle" fill="#6f6159" font-size="14">ready to prompt</text>
    </g>
  </g>

  <text x="720" y="650" text-anchor="middle" fill="#858c9a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="1.5">SWIFTUI · SCREENCAPTUREKIT · APPKIT</text>
</svg>
